<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.admin{max-width:1200px;margin:auto;padding:30px 18px}.box{background:white;padding:25px;border:1px solid #e0e8e2;border-radius:18px;margin-bottom:20px}.input{width:100%;padding:12px;border:1px solid #dfe7e1;border-radius:9px;margin:7px 0 12px}.btn{background:#1d6540;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:#f0f6f2;padding:20px;border-radius:13px}.stat b{font-size:30px;display:block}table{width:100%;border-collapse:collapse;min-width:1200px}th,td{padding:11px;border-bottom:1px solid #e5ebe7;text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase}.scroll{overflow:auto}@media(max-width:700px){.stats{grid-template-columns:1fr}}</style></head><body><header><b>♻ GROUP YELLOW ADMIN</b><a href="index.html">Survey</a></header><main class="admin"><div id="login" class="box"><h1>Private Admin Login</h1><input class="input" id="email" type="email" placeholder="Email"><input class="input" id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn">Sign in</button><p id="msg"></p></div><div id="dash" class="hidden"><div class="box"><h1>Waste Management Dashboard</h1><div class="stats"><div class="stat">Responses<b id="total">0</b></div><div class="stat">Q2: Enough bins — Yes<b id="bins">0%</b></div><div class="stat">Q19: Satisfied+<b id="clean">0%</b></div></div></div><div class="box"><input class="input" id="search" placeholder="Search responses"><button class="btn" id="csv">Export CSV</button><div class="scroll"><table><thead><tr><th>Date</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Q5</th><th>Q6</th><th>Q7</th><th>Q8</th><th>Q9</th><th>Q10</th><th>Q11</th><th>Q12</th><th>Q13</th><th>Q14</th><th>Q15</th><th>Q16</th><th>Q17</th><th>Q18</th><th>Q19</th><th>Q20</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script src="config.js"></script><script>let data=[];const login=document.getElementById("login"),dash=document.getElementById("dash");async function start(){if((await supabaseClient.auth.getSession()).data.session)show()}function show(){login.classList.add("hidden");dash.classList.remove("hidden");load()}document.getElementById("loginBtn").onclick=async()=>{const r=await supabaseClient.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)msg.textContent=r.error.message;else show()};async function load(){const r=await supabaseClient.from("waste_management_responses").select("*").order("created_at",{ascending:false});if(r.error)return alert(r.error.message);data=r.data||[];render(data)}function render(a){total.textContent=a.length;bins.textContent=a.length?Math.round(a.filter(x=>x.q2==="Yes").length/a.length*100)+"%":"0%";clean.textContent=a.length?Math.round(a.filter(x=>["Satisfied","Very satisfied"].includes(x.q19)).length/a.length*100)+"%":"0%";rows.innerHTML=a.map(x=>"<tr>"+["created_at",...Array.from({length:20},(_,i)=>"q"+(i+1))].map(k=>"<td>"+(Array.isArray(x[k])?x[k].join(", "):(x[k]??"—"))+"</td>").join("")+"</tr>").join("")}search.oninput=()=>{let q=search.value.toLowerCase();render(data.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))};csv.onclick=()=>{if(!data.length)return;let k=Object.keys(data[0]);let e=v=>`"${String(Array.isArray(v)?v.join("; "):v??"").replaceAll('"','""')}"`;let c=[k.join(","),...data.map(r=>k.map(x=>e(r[x])).join(","))].join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="waste-management-responses.csv";a.click()};start()</script></body></html>
